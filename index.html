<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hiking Scenario</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Hiking Scenario</h1>

        <video id="treadmill-video" controls>
            <source src="videos/hiking.mp4" type="video/mp4">
            Your browser does not support video playback.
        </video>

        <!-- Prompt -->
        <div id="medication-prompt-modal" class="prompt-modal">

            <div class="prompt-box">

                <p class="question-text"></p>

                <!-- Options will be generated by JavaScript --> <div class="answers" id="answers-container"> </div>
                </div>

                <button id="ignore-btn" class="ignore-btn">
                    Ignore prompt
                </button>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
